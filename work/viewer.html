<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qualifying Exam · Shubham Mishra</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111719;color:#e9eeee;font:14px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#253033;border:1px solid #3a484c;border-radius:7px;padding:8px 12px}button:hover{background:#35464a}button:focus-visible,input:focus-visible{outline:2px solid #39b9b5;outline-offset:3px}.app{height:100%;display:grid;grid-template-columns:275px 1fr;grid-template-rows:62px 1fr 58px}header{grid-column:1/-1;border-bottom:1px solid #304045;display:flex;align-items:center;gap:16px;padding:0 20px}header strong{font-weight:600}header small{color:#a3b2b5}.spacer{flex:1}#status{font-size:12px;color:#8cd4ce}aside{overflow:auto;border-right:1px solid #304045;padding:16px 12px}#search{width:100%;padding:10px;border:1px solid #3a484c;border-radius:7px;background:#1b2528;color:white;position:sticky;top:0;z-index:2}.group{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#91a7ac;margin:22px 9px 9px}.slide-link{display:flex;align-items:flex-start;gap:10px;border:0;background:none;text-align:left;width:100%;padding:10px 9px;margin:2px 0;color:#c3ced0;font-size:12px;line-height:1.45}.slide-link span{color:#81969c;min-width:23px;font-variant-numeric:tabular-nums}.slide-link.active{background:#204543;color:#fff}.slide-link.active span{color:#89d5cd}main{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px;position:relative}iframe{background:white;width:100%;height:100%;border:0;box-shadow:0 15px 60px #0008;aspect-ratio:16/9;max-height:100%}#frameWrap{aspect-ratio:16/9;width:100%;max-height:100%;display:flex}footer{grid-column:2;display:flex;gap:10px;align-items:center;padding:10px 24px;border-top:1px solid #304045}#counter{display:flex;align-items:center;gap:8px;color:#acbfc2}#jump{background:#1b2528;border:1px solid #3a484c;border-radius:5px;color:white;width:54px;padding:6px;text-align:center}#title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aebec2;font-size:12px;max-width:35vw}#notes{display:none;position:absolute;bottom:30px;right:32px;background:#172225ed;border:1px solid #4d6268;border-radius:10px;padding:20px;max-height:45%;overflow:auto;width:420px;white-space:pre-wrap;line-height:1.6;box-shadow:0 12px 40px #0008}body.notes #notes{display:block}body.focus .app{grid-template-columns:1fr;grid-template-rows:1fr}body.focus header,body.focus aside,body.focus footer{display:none}body.focus main{padding:0;grid-column:1;grid-row:1;background:black}#hint{font-size:11px;color:#8ea1a5}#loading{position:absolute;color:#17202a;z-index:1}@media(max-width:850px){.app{grid-template-columns:1fr}aside{display:none}footer{grid-column:1}header small,#title,#hint{display:none}main{padding:10px}footer{padding:10px}}

/* Presenter script stays visible in normal and presentation modes. */
.app{grid-template-rows:62px minmax(0,1fr) 58px 30vh}
aside{grid-column:1;grid-row:2/4}
main{grid-column:2;grid-row:2;padding:16px}
footer{grid-row:3}
#speakerPanel{grid-column:1/-1;grid-row:4;min-height:0;display:flex;flex-direction:column;background:#1b2528;border-top:2px solid #3e6666;padding:16px 28px 20px}
.script-heading{display:flex;align-items:center;gap:16px;flex:none;margin-bottom:12px;color:#a7c0c3;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
#scriptSlide{color:#87d6cc;text-transform:none;letter-spacing:0}
#speakerScript{overflow:auto;white-space:pre-wrap;line-height:1.55;font-size:clamp(20px,1.4vw,28px);color:#f2f5f5;max-width:1450px;width:100%;margin:0 auto;padding:0 12px 12px;scrollbar-gutter:stable}
#speakerScript.empty{color:#91a7ac;font-style:italic}
#jump{width:68px}
.build-group{margin:4px 0;border:1px solid #34494d;border-radius:7px;overflow:hidden}
.build-group summary{display:flex;gap:10px;align-items:baseline;padding:11px 9px;cursor:pointer;font-size:12px;line-height:1.45;color:#d2dfe1;list-style:none}
.build-group summary::-webkit-details-marker{display:none}
.build-group summary::before{content:'▸';color:#91a7ac;flex:none}
.build-group[open] summary::before{content:'▾'}
.build-group summary .group-number{min-width:22px;color:#89d5cd}
.build-group summary:focus-visible{outline:2px solid #39b9b5;outline-offset:-3px}
.build-group.contains-active{border-color:#4b8882}
.build-group .slide-link{padding-left:30px;margin:0;border-radius:0}
.build-group .slide-link span{min-width:30px}
body.focus .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 30vh}
body.focus main{grid-column:1;grid-row:1}
body.focus #speakerPanel{grid-column:1;grid-row:2}
@media(max-width:850px){.app{grid-template-rows:52px minmax(0,1fr) 52px 30vh}main{grid-column:1;padding:8px}#speakerPanel{padding:12px 14px}#speakerScript{font-size:20px}.script-heading{margin-bottom:8px}}
</style></head>
<body><div class="app"><header><strong>Qualifying Exam</strong><small>Shubham Mishra · Berkeley</small><div class="spacer"></div><span id="status">Opening deck…</span><button id="notesButton" title="Research and authoring notes (N)">Reference notes</button><button id="present" title="Presentation mode (F)">Present</button></header><aside><input id="search" type="search" placeholder="Find a slide…" aria-label="Search slides"><nav id="outline"></nav></aside><main><div id="loading">Opening slides…</div><div id="frameWrap"><iframe id="slides" title="Qualifying exam slides"></iframe></div><div id="notes"></div></main><footer><button id="prev" title="Previous slide">←</button><div id="counter"><input id="jump" type="text" value="1" aria-label="Slide or build number"><span id="total">/ 100</span></div><button id="next" title="Next slide">→</button><span id="title"></span><div class="spacer"></div><span id="hint">Space: next build</span><button id="step" title="Next animation or slide">Next build</button></footer><section id="speakerPanel" aria-label="Speaker notes"><div class="script-heading"><strong>Speaker notes</strong><span id="scriptSlide"></span></div><div id="speakerScript" tabindex="0"></div></section></div>
<script>
const livePreview=true;
const svgSource=__SVG_JSON__;
const deck=__DECK_JSON__;
const frame=document.getElementById('slides'),outline=document.getElementById('outline');
const buildGroups=new Map();
deck.forEach((s,n)=>{if(s.slideGroup){const id=s.slideGroup.id;if(!buildGroups.has(id))buildGroups.set(id,[]);buildGroups.get(id).push(n)}});
let logicalTotal=0;
const groupNumbers=new Map();
const slideNumbers=deck.map(s=>{
 const group=s.slideGroup;
 if(!group)return ++logicalTotal;
 if(!groupNumbers.has(group.id))groupNumbers.set(group.id,++logicalTotal);
 group.number=groupNumbers.get(group.id);
 return group.number;
});
function buildLabel(n){const group=deck[n].slideGroup;return String(slideNumbers[n])+(group?String.fromCharCode(97+buildGroups.get(group.id).indexOf(n)):'')}
function cleanScript(s){
 if(s.speakerScript!==undefined)return s.speakerScript;
 return (s.notes||'').split(/\n\s*(?:Authoring clarification:|Sources?:|Measurement scope:|Revision:|Visual direction:|Visual:)/)[0].replace(/^User script:\s*/,'').replace(/<[^>]*>/g,'').trim();
}
let current=Math.max(0,Math.min(deck.length-1,(parseInt(location.hash.slice(1))||1)-1)),ready=false;
// Compare authored slide content across refreshes, independent of playback state.
function changedSlide(){
 try {
  const source=new DOMParser().parseFromString(svgSource,'image/svg+xml');
  const slides=[...source.querySelectorAll('.SlideGroup > g')];
  const serialize=new XMLSerializer();
  const signatures=slides.map((slide,index)=>{
   const content=serialize.serializeToString(slide);
   let hash=2166136261;
   for(let i=0;i<content.length;i++)hash=Math.imul(hash^content.charCodeAt(i),16777619);
   return {id:slide.querySelector('.Slide').id,hash:hash>>>0,index};
  });
  const key='quals-slide-signatures-v1';
  const old=JSON.parse(sessionStorage.getItem(key)||'null');
  sessionStorage.setItem(key,JSON.stringify(signatures));
  if(!old)return null;
  const prior=new Map(old.map(s=>[s.id,s.hash]));
  const changes=signatures.filter(s=>prior.get(s.id)!==s.hash);
  return changes.length ? changes[0].index : null;
 }catch(error){return null;}
}
const authoredChange=livePreview?changedSlide():null;
if(authoredChange!==null)current=authoredChange;
const initialSlide=current;
function w(){return frame.contentWindow}
function update(n){
 const changed=current!==n;current=n;
 document.getElementById('jump').value=buildLabel(n);
 document.getElementById('total').textContent='/ '+logicalTotal+' slides';
 document.getElementById('title').textContent=deck[n].title;
 document.getElementById('notes').textContent=deck[n].notes||'No reference notes for this slide.';
 const script=document.getElementById('speakerScript'),text=cleanScript(deck[n]);
 script.textContent=text||'No speaker script for this slide yet.';script.classList.toggle('empty',!text);
 if(changed)script.scrollTop=0;
 document.getElementById('scriptSlide').textContent='Slide '+buildLabel(n)+' · '+deck[n].title;
 document.querySelectorAll('.slide-link').forEach(b=>{const active=+b.dataset.n===n;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
 document.querySelectorAll('.build-group').forEach(d=>{const active=d.dataset.group===deck[n].slideGroup?.id;d.classList.toggle('contains-active',active);if(active)d.open=true});
 if(changed)outline.querySelector('.slide-link.active')?.scrollIntoView({block:'nearest'});
 history.replaceState(null,'','#'+(n+1));
}
function go(n){if(!ready)return;n=Math.max(0,Math.min(deck.length-1,n));w().aSlideShow.displaySlide(n,true);update(n);}
function nextBuild(){if(ready)w().aSlideShow.nextEffect();}
function list(q=''){
 const expanded=new Set([...outline.querySelectorAll('.build-group[open]')].map(d=>d.dataset.group));
 outline.replaceChildren();let section='';const seen=new Set();q=q.toLowerCase();
 const matches=n=>!q||(deck[n].title+' '+deck[n].text+' '+buildLabel(n)+' '+(deck[n].slideGroup?.title||'')).toLowerCase().includes(q);
 function link(n,parent){const s=deck[n],b=document.createElement('button');b.className='slide-link'+(n===current?' active':'');b.dataset.n=n;if(n===current)b.setAttribute('aria-current','step');const number=document.createElement('span');number.textContent=buildLabel(n);b.append(number,document.createTextNode(s.title));b.onclick=()=>go(n);parent.append(b)}
 deck.forEach((s,n)=>{
  const g=s.slideGroup;if(g&&seen.has(g.id))return;
  const members=g?buildGroups.get(g.id):[n];if(g)seen.add(g.id);
  if(!members.some(matches))return;
  if(s.section!==section){section=s.section;const h=document.createElement('div');h.className='group';h.textContent=section;outline.append(h)}
  if(!g){link(n,outline);return}
  const details=document.createElement('details');details.className='build-group';details.dataset.group=g.id;
  details.open=!!q||members.includes(current)||expanded.has(g.id);details.classList.toggle('contains-active',members.includes(current));
  const summary=document.createElement('summary'),number=document.createElement('span');number.className='group-number';number.textContent=g.number;
  summary.append(number,document.createTextNode(g.title));details.append(summary);members.forEach(i=>link(i,details));outline.append(details);
 });
}
function jumpTo(value){
 const label=value.trim().toLowerCase();
 let n=deck.findIndex((s,i)=>buildLabel(i).toLowerCase()===label);
 if(n<0)n=deck.findIndex(s=>s.slideGroup&&String(s.slideGroup.number)===label);
 if(n>=0)go(n);else document.getElementById('jump').value=buildLabel(current);
}
function resize(){const m=document.querySelector('main'),style=getComputedStyle(m),pad=parseFloat(style.paddingLeft)*2;const width=Math.min(m.clientWidth-pad,(m.clientHeight-pad)*16/9);document.getElementById('frameWrap').style.width=width+'px';}
function focusMode(){document.body.classList.toggle('focus');resize();}
function keys(e){if(['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='Escape'){document.body.classList.remove('focus');resize();}else if(e.key==='f'||e.key==='F'){e.preventDefault();focusMode()}else if(e.key==='n'||e.key==='N'){document.body.classList.toggle('notes')}else if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();nextBuild()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(deck.length-1)}}
document.addEventListener('keydown',keys);document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('step').onclick=nextBuild;document.getElementById('jump').onchange=e=>jumpTo(e.target.value);document.getElementById('jump').onkeydown=e=>{if(e.key==='Enter'){jumpTo(e.target.value);e.target.blur()}};document.getElementById('search').oninput=e=>list(e.target.value);document.getElementById('present').onclick=focusMode;document.getElementById('notesButton').onclick=()=>document.body.classList.toggle('notes');window.addEventListener('resize',resize);window.addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));
list();update(current);resize();
frame.src=location.protocol==='file:'?URL.createObjectURL(new Blob([svgSource],{type:'image/svg+xml'})):'deck.svg';
const initTimer=setInterval(()=>{try{if(w().aSlideShow&&w().theMetaDoc){ready=true;clearInterval(initTimer);w().document.addEventListener('keydown',e=>{if(['f','F','n','N','Escape'].includes(e.key)){e.stopImmediatePropagation();keys(e)}},true);go(initialSlide);document.getElementById('loading').style.display='none';document.getElementById('status').textContent=location.protocol==='file:'?'Offline copy':livePreview?'Live updates on':'Published deck';}}catch(e){}},100);
setInterval(()=>{try{if(ready&&Number.isInteger(w().nCurSlide)&&w().nCurSlide!==current)update(w().nCurSlide)}catch(e){}},150);
let revision=null;
if(livePreview&&location.protocol!=='file:')setInterval(async()=>{try{const r=await fetch('/api/revision',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();if(revision&&revision!==data.revision)location.reload();revision=data.revision;document.getElementById('status').textContent='Live updates on';}catch(e){document.getElementById('status').textContent='Reconnecting…'}},1500);
</script></body></html>
