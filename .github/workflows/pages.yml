name: Publish slides
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build static deck
        run: python work/build_web.py --static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site
      # v4.0.0 uses the REST artifact lookup; newer v4 builds currently return
      # an empty internal artifact list even after a successful upload.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.0
