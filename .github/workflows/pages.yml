name: Publish slides
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build static deck
        run: python work/build_web.py --static
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: outputs/site
      - name: Wait for Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PYTHON'
          import json, os, time, urllib.request
          url = (f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
                 f"/actions/runs/{os.environ['GITHUB_RUN_ID']}/artifacts?name=github-pages")
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json", "Cache-Control": "no-cache"}
          for attempt in range(24):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                  artifacts = json.load(response)["artifacts"]
              if any(a["name"] == "github-pages" and not a["expired"] for a in artifacts):
                  print("Pages artifact is ready.")
                  break
              print("Waiting for uploaded artifact to become available...", flush=True)
              time.sleep(5)
          else:
              raise SystemExit("Pages artifact did not become available within two minutes.")
          PYTHON
      # Match the REST lookup used by the readiness check above.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4.0.0
